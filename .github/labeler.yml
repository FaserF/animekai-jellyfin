backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'Jellyfin.Plugin.AnimeKai/**/*.cs'
          - 'Jellyfin.Plugin.AnimeKai/Jellyfin.Plugin.AnimeKai.csproj'

frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'Jellyfin.Plugin.AnimeKai/Configuration/**/*.html'

tests:
  - changed-files:
      - any-glob-to-any-file:
          - 'Jellyfin.Plugin.AnimeKai.Tests/**/*'

ci-cd:
  - changed-files:
      - any-glob-to-any-file:
          - '.github/**/*'

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - '*.md'
          - 'docs/**/*'
